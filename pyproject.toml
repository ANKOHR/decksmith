[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decksmith"
version = "0.1.0"
description = "A deterministic synthetic-evidence-to-deck compiler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
decksmith = "decksmith.cli:main"

[tool.setuptools]
packages = ["decksmith"]

[tool.setuptools.package-data]
decksmith = ["theme.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
