name: Field Notes
palette:
  ink: "#24343A"
  teal: "#2C6E73"
  amber: "#E5A94F"
  rust: "#A85D46"
  paper: "#F8F6F1"
  white: "#FFFFFF"
type_scale:
  title: 62px
  section: 46px
  heading: 27px
  body: 25px
